<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – Digital Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-box">
  <h2>Login</h2>
  <p>Only @sacredheart.ie emails allowed</p>

  <input type="email" id="email" placeholder="School Email">

  <button id="emailBtn">Login with Email</button>
  <button class="google-btn" id="googleBtn">Login with Google</button>
</div>

<script type="module">
  import { googleLogin, emailLogin } from "./auth.js";

  document.getElementById("googleBtn").onclick = googleLogin;

  document.getElementById("emailBtn").onclick = () => {
    emailLogin(document.getElementById("email").value.trim());
  };
    import { protectPage } from "./auth.js";
  protectPage();
</script>


</body>
</html>
