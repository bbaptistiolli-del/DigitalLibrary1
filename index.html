<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <tittle>Digital Study Library </tittle>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1> 📚 Digital Study Library </h1>
    <p> Click a book to read instantly </p>
  </header>
<nav>
  <button onclick="openSection('library')">📘 Books</button>
</nav>
  <section id="library" class="page">
    <div id="bookGrid" class="book-grid"></div>
  </section>
  <div id="pdfPopup" class="popup">
  <div class="popup-header">
    <button onclick="closePDF()">⬅ Back</button>
    <a id="pdfDownload" download>Download</a>
  </div>
  <iframe id="pdfFrame"></iframe>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
